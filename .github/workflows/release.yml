name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Pack
        run: |
          npm pack
          cp opencode-gateway-catalog-*.tgz opencode-gateway-catalog.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            opencode-gateway-catalog-*.tgz
            opencode-gateway-catalog.tgz
          generate_release_notes: true

      # OpenCode can only install npm registry packages or Git specifiers (not
      # release asset URLs), and GitHub source tarballs do not contain the
      # gitignored dist/. Publish the build output on the `dist` branch so that
      # `opencode plugin add "git+https://...#dist"` works out of the box.
      - name: Publish dist branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist-branch"
          cp -r dist "$RUNNER_TEMP/dist-branch/dist"
          cp package.json README.md LICENSE "$RUNNER_TEMP/dist-branch/"
          cd "$RUNNER_TEMP/dist-branch"
          git init -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: ${GITHUB_REF_NAME}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
